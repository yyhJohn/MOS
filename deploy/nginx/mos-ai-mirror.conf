location = /hci-demo/ai/connect {
    include /etc/nginx/snippets/mos-ai-auth.conf;
    proxy_pass http://unix:/run/mos-ai/mos-ai.sock:/connect;
}
location = /hci-demo/ai/chat {
    include /etc/nginx/snippets/mos-ai-auth.conf;
    limit_req zone=mos_ai_ip burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/run/mos-ai/mos-ai.sock:/chat;
}
location = /hci-demo/ai/curtain {
    include /etc/nginx/snippets/mos-ai-auth.conf;
    limit_req zone=mos_ai_ip burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/run/mos-ai/mos-ai.sock:/curtain;
}
